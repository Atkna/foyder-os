# Supabase'in ücretsiz planı, bir hafta istek gelmeyen projeyi duraklatır.
# Bu iş üç günde bir veritabanına kısa bir okuma isteği gönderir; hiçbir veriyi değiştirmez.
name: Supabase uyanık tut

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false
      - name: Veritabanına okuma isteği gönder
        run: |
          URL=$(grep -oE "SB_URL='[^']+'" index.html | head -1 | cut -d"'" -f2)
          KEY=$(grep -oE "SB_KEY='[^']+'" index.html | head -1 | cut -d"'" -f2)
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/app_state?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase yanıtı: $CODE"
          if [ "$CODE" -ge 500 ] || [ "$CODE" = "000" ]; then exit 1; fi
